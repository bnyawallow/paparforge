name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy Container to Hostinger VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            set -e

            # Target directory on Hostinger VPS
            DEPLOY_DIR="~/ar-forge"
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            # Authenticate to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull latest image built by GitHub Actions
            IMAGE_TAG="ghcr.io/${{ github.repository }}:latest"
            docker pull $IMAGE_TAG

            # Create or update environment configuration file
            cat << 'EOF' > .env
            NODE_ENV=production
            PORT=3000
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            APP_URL=${{ secrets.APP_URL }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF

            # Write docker-compose.yml file on VPS
            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              app:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: ar_forge_app
                restart: always
                ports:
                  - "3000:3000"
                env_file:
                  - .env
                volumes:
                  - ar_papar_data:/app/dist/papar
                  - ar_sqlite_data:/app/data

            volumes:
              ar_papar_data:
              ar_sqlite_data:
            EOF

            # Deploy using Docker Compose
            if command -v docker-compose &> /dev/null; then
              docker-compose pull
              docker-compose up -d --remove-orphans
            else
              docker compose pull
              docker compose up -d --remove-orphans
            fi

            # Clean up old unused images to save disk space
            docker image prune -f
